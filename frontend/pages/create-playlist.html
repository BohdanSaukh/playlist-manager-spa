<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Playlist - Playlist Manager</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body class="page-body">
    <header class="main-header">
        <nav class="navbar">
            <div class="logo">Playlist Manager</div>
            <ul class="nav-links">
                <li><a href="playlists.html" class="active">Playlists</a></li>
                <li><a href="users.html">Users</a></li>
                <li><a href="../index.html" class="logout-btn">Logout</a></li>
            </ul>
        </nav>
    </header>
    <main class="content-wrapper">
        <section class="form-section">
            <h2>Create New Playlist</h2>
            
            <form action="playlists.html" class="custom-form">
                <div class="form-group">
                    <label for="playlist_name">Playlist Name</label>
                    <input type="text" id="playlist_name" name="playlist_name" required>
                </div>
                
                <div class="form-group">
                    <label for="visibility">Visibility</label>
                    <select id="visibility" name="visibility" required>
                        <option value="public">Public</option>
                        <option value="private">Private</option>
                    </select>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create</button>
                    <a href="playlists.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </section>
    </main>
    <script type="module" src="../js/create-playlist.js"></script>
</body>
</html>
